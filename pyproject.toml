[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knoxcall"
version = "1.1.0"
description = "Official KnoxCall API client for Python"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "KnoxCall" }]
keywords = ["knoxcall", "api", "sdk", "oauth", "oauth2", "dpop"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://docs.knoxcall.com/api-reference"
Repository = "https://github.com/knoxcall/sdk-python"
Issues = "https://github.com/knoxcall/sdk-python/issues"

[project.scripts]
knoxcall = "knoxcall.cli:main"

[project.optional-dependencies]
redis = ["redis>=4.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "requests>=2.31", "urllib3>=2.0", "aiohttp>=3.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/knoxcall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
